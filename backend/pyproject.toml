[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "medlingo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9", "fastapi>=0.111,<1.0", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0,<3.0", "alembic>=1.13", "pydantic>=2.7", "pydantic-settings>=2.2", "httpx[socks]>=0.27", "pyyaml>=6.0", "rapidfuzz>=3.9", "unidecode>=1.3", "python-multipart>=0.0.9", "lxml>=5.2", "pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "types-PyYAML"]
[tool.setuptools.packages.find]
include = ["app*", "ingest*"]
[tool.setuptools.package-data]
"app.models" = ["*.sql"]
"ingest" = ["curated/**/*.yaml", "fixtures/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
